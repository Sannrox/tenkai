name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      TENKAI_UI_BUNDLE: ${{ github.workspace }}/.tenkai-console.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tenkai-console.zip
          key: console-${{ hashFiles('ui/console.pin') }}
      - run: bash scripts/fetch-console-bundle.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install PKCS#11 software token
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: make test
      - run: make test-integration
      # Uses TENKAI_UI_BUNDLE; fails on a checksum mismatch.
      - run: cargo test --locked -p tenkai-http --features ui --lib ui
      - run: cargo test --locked -p tenkai-postgres --features postgres

  failover-drill:
    name: Failover drill
    runs-on: ubuntu-latest
    # An ephemeral PostgreSQL for this job only. The password is a local
    # test value; the database never leaves the runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenkai
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: tenkai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenkai -d tenkai_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TENKAI_POSTGRES_URL: postgresql://tenkai:local-test-only@127.0.0.1:5432/tenkai_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The hub writer lease and the kill-the-leader drill (#748, #749),
      # the hub HA qualification drill (#903), the large property value
      # migration (#879), and tenant feedback observation capture (#868).
      - run: cargo test --locked -p tenkai-postgres --features postgres --lib -- --ignored live_writer_lease live_failover_drill live_ha_qualification live_property_lookup live_feedback_capture

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: rustfmt
      - run: cargo fmt --check

  # The v* workflow's Linux host build, notes, SBOM, and manifest steps.
  # Linux hosts are real and must start on the oldest supported
  # distributions (#904); macOS hosts are stubs. No attestations, tags, or
  # releases.
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/linux-release-hosts
          key: linux-release-hosts-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-release-hosts-
      - name: Build Linux hosts
        run: bash scripts/build-linux-release-hosts.sh --out linux-hosts
      - name: Run Linux hosts on RHEL 8 and 9, Debian 12, Ubuntu 22.04
        run: |
          for image in registry.access.redhat.com/ubi8/ubi-minimal registry.access.redhat.com/ubi9/ubi-minimal \
            debian:12 ubuntu:22.04; do
            echo "== ${image}"
            docker run --rm --network none -v "${PWD}/linux-hosts:/hosts:ro" "$image" sh -ec '
              /hosts/tenkaictl-linux-x86_64 --version
              for host in tenkaictl tenkai-server tenkai-server-postgres tenkai-executor-guard \
                tenkai-runtime tenkai-runtime-guard tenkai-host-applier; do
                /hosts/${host}-linux-x86_64 --help >/dev/null
                echo "${host} ok"
              done'
          done
      - name: Install script on Ubuntu 22.04, Debian 12, RHEL 8 and 9; refused on Alpine
        run: bash scripts/test-install-script.sh --linux-hosts linux-hosts
      - run: bash scripts/release-dry-run.sh --linux-hosts linux-hosts

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      TENKAI_UI_BUNDLE: ${{ github.workspace }}/.tenkai-console.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tenkai-console.zip
          key: console-${{ hashFiles('ui/console.pin') }}
      - run: bash scripts/fetch-console-bundle.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: make validate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  # Linux proof for privileged host releases (ADR 0041 §2): the template
  # unit and polkit rule installed for real, driven by an unprivileged user,
  # then tenkai-server as that user installing a host release through them.
  host-applier-systemd:
    name: Host applier systemd drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install polkit
        run: sudo apt-get update && sudo apt-get install -y polkitd
      - name: Build the applier, the drill fixture, the server, and the CLI
        run: cargo build --locked -p tenkai-host-applier -p tenkai-server -p tenkaictl --bin tenkai-host-applier --bin tenkai-server --bin tenkaictl --example host_apply_drill
      - name: Run the drill
        run: bash scripts/host-applier-systemd-drill.sh target/debug/tenkai-host-applier target/debug/examples/host_apply_drill
      - name: Run the server-side drill
        run: bash scripts/host-executor-drill.sh target/debug
      - name: Applier journal
        if: always()
        run: sudo journalctl -t tenkai-host-apply --no-pager || true

  kubernetes-inprocess:
    name: Kind in-process apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          install_only: true
      - name: Create kind cluster and exercise server-side apply
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            tmp="$(mktemp)"
            for attempt in 1 2 3 4; do
              if curl -fsSL -o "$tmp" "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "failed to download kubectl" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
            chmod +x "$tmp"
            sudo mv "$tmp" /usr/local/bin/kubectl
          fi
          kind create cluster --name tenkai-ssa --wait 120s
          scoped="$HOME/tenkai-cluster"
          mkdir -p "$scoped"
          kind get kubeconfig --name tenkai-ssa > "$scoped/config"
          chmod 600 "$scoped/config"
          TENKAI_CLUSTER_CONFIG="$scoped/config" \
            cargo test --locked -p tenkai-executor --test in_process_kubernetes_kind -- --ignored --nocapture --test-threads=1

  egress-conformance:
    name: Isolated-network conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Pull requests run this only when they touch executors, server
      # configuration or the build; pushes to main and the schedule always do.
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(crates/tenkai-executor/|crates/tenkai-server/|crates/tenkaictl/|crates/tenkai-http/src/config\.rs|src/(software_executor|model_runtime|offline_|connectivity|outbound_tls|oci_artifact|oidc_verifier|telemetry|deploy_webhook|runtime_agent)|Cargo\.(toml|lock)|build\.rs|crates/[^/]+/build\.rs|crates/[^/]+/Cargo\.toml|scripts/egress-conformance\.sh|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y strace
      - if: steps.scope.outputs.run == 'true'
        run: bash scripts/egress-conformance.sh

  # Proto compatibility against the last final v* tag (proto/buf.yaml sets the
  # rules). A reported break passes only when the pull request is marked
  # breaking (`type!:` subject or a Breaking/Upgrade section, see
  # CONTRIBUTING.md) and labelled `risk:breaking`; a tool failure stays red.
  proto-breaking:
    name: Proto breaking
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          setup_only: true
      - name: buf breaking
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$BASE" 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "::notice::No final v* tag yet; nothing to compare against."
            exit 0
          fi
          if ! git cat-file -e "${tag}:proto" 2>/dev/null; then
            echo "::notice::${tag} has no proto/ directory; nothing to compare against."
            exit 0
          fi
          rc=0
          out="$(buf breaking proto --against ".git#tag=${tag},subdir=proto" --error-format github-actions 2>&1)" || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] && exit 0
          # buf exits 100 for reported incompatibilities; anything else is a tool error.
          if [[ $rc -ne 100 ]]; then
            echo "::error::buf breaking failed without reporting a break (exit ${rc}); see the log."
            exit "$rc"
          fi
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Proto break against ${tag} accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::buf breaking found incompatible proto changes against ${tag}. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1

  rollout-time:
    name: Rollout-time budget
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          install_only: true
      - name: Measure Docker and kind apply against the stored baseline
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            tmp="$(mktemp)"
            for attempt in 1 2 3 4; do
              if curl -fsSL -o "$tmp" "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "failed to download kubectl" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
            chmod +x "$tmp"
            sudo mv "$tmp" /usr/local/bin/kubectl
          fi
          kind create cluster --name tenkai-rollout --wait 120s
          scoped="$HOME/tenkai-cluster"
          mkdir -p "$scoped"
          kind get kubeconfig --name tenkai-rollout > "$scoped/config"
          chmod 600 "$scoped/config"
          TENKAI_CLUSTER_CONFIG="$scoped/config" bash scripts/check-rollout-time.sh

  # Public API of the library crates against the pull request base. Versions
  # are release-owned, so a pull request never bumps them: a reported break
  # passes only when the pull request is marked breaking (`type!:` subject or
  # a Breaking/Upgrade section, see CONTRIBUTING.md) and labelled
  # `risk:breaking`, which the release manifest turns into a gate.
  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TENKAI_UI_BUNDLE: ${{ github.workspace }}/.tenkai-console.zip
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tenkai-console.zip
          key: console-${{ hashFiles('ui/console.pin') }}
      - run: bash scripts/fetch-console-bundle.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # Bump with the toolchain: each release reads a range of rustdoc JSON formats.
          tool: cargo-semver-checks@0.51.0
      - name: cargo-semver-checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Every workspace library crate, so a new crate is covered without editing this list.
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          mapfile -t packages < <(jq -r '.packages[] | select(any(.targets[]; .kind | index("lib"))) | .name' <<<"$metadata")
          # One run per package: only a package that reports a break can be
          # waived; a tool or build failure in any package stays red.
          broken=()
          for package in "${packages[@]}"; do
            # A crate added by this pull request has no baseline to compare.
            manifest="$(jq -r --arg p "$package" '.packages[] | select(.name == $p) | .manifest_path' <<<"$metadata")"
            if ! git cat-file -e "${BASE}:${manifest#"$PWD"/}" 2>/dev/null; then
              echo "::notice::${package} is new in this pull request; no baseline to check."
              continue
            fi
            rc=0
            out="$(cargo semver-checks --package "$package" --baseline-rev "$BASE" 2>&1)" || rc=$?
            echo "$out"
            [[ $rc -eq 0 ]] && continue
            if grep -qE 'semver requires new major version' <<<"$out"; then
              broken+=("$package")
            elif grep -qE 'semver requires new minor version' <<<"$out"; then
              # The unchanged version reads as a patch release, so compatible
              # additions such as deprecations report "minor"; they pass.
              echo "::notice::${package}: minor-level API change (compatible)."
            else
              echo "::error::cargo-semver-checks failed for ${package} without reporting an API break; see the log."
              exit "$rc"
            fi
          done
          [[ ${#broken[@]} -eq 0 ]] && exit 0
          echo "API break reported in: ${broken[*]}"
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Public API break accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::cargo-semver-checks found a public API break. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1
