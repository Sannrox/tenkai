name: Rollout-time budget

# Live Docker and kind apply times against perf/rollout-baseline.json (#596).
# Weekly and on demand only: a pull request diff rarely moves these budgets,
# and the regression gate needs a live daemon and cluster.
on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rollout-time:
    name: Rollout-time budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          install_only: true
      - name: Measure Docker and kind apply against the stored baseline
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            tmp="$(mktemp)"
            for attempt in 1 2 3 4; do
              if curl -fsSL -o "$tmp" "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "failed to download kubectl" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
            chmod +x "$tmp"
            sudo mv "$tmp" /usr/local/bin/kubectl
          fi
          kind create cluster --name tenkai-rollout --wait 120s
          scoped="$HOME/tenkai-cluster"
          mkdir -p "$scoped"
          kind get kubeconfig --name tenkai-rollout > "$scoped/config"
          chmod 600 "$scoped/config"
          TENKAI_CLUSTER_CONFIG="$scoped/config" bash scripts/check-rollout-time.sh
