name: Release binaries

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. Pull
# requests run scripts/release-dry-run.sh from CI. workflow_dispatch without a
# tag dry-runs the packaging path and never attests or publishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # start from main: main's verify-release-tag.sh and allowed keys verify the
  # signed tag against the tagged commit's Cargo.toml. That commit must be on
  # main or the matching release-* line. A dry run resolves the checked-out
  # commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the signed tag and its line
        if: inputs.tag != ''
        id: verify
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_ROOT="$PWD" \
            RELEASE_TAG_KEY="${MAIN_TREE}/security/release-tag-key.asc" \
            RELEASE_TAG_FINGERPRINTS="${MAIN_TREE}/security/release-tag-fingerprints" \
            bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify-signed "$TAG" "$sha"
          line="$(bash "${MAIN_TREE}/scripts/verify-release-tag.sh" maintenance-line "$TAG")"
          if git ls-remote --exit-code origin "refs/heads/${line}" >/dev/null; then
            git fetch --force origin "+refs/heads/${line}:refs/remotes/origin/${line}"
          fi
          accepted="$(bash "${MAIN_TREE}/scripts/verify-release-tag.sh" require-ancestry "$TAG" "$sha")"
          echo "tag ${TAG} commit ${sha} is on ${accepted}"
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only "release not found" or a draft may continue; a token that
          # cannot see drafts reports a draft as not found.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "GitHub Release ${TAG} is already published; releases are immutable" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Require the CHANGELOG section and its gate flags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release-metadata.py notes "${TAG#v}" >/dev/null
          python3 scripts/release-metadata.py gate-flags "${TAG#v}"
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  dry-run:
    name: Dry-run packaging
    if: needs.verify-tag.outputs.tag == ''
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - run: bash scripts/validate-release-packaging.sh
      - run: bash scripts/release-dry-run.sh

  sbom:
    name: Validate CycloneDX SBOM
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.validate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      # The validator is third-party Python. It only reads the SBOM: the
      # digest is taken before it is installed, and the attest job
      # regenerates the SBOM and must match that digest.
      - name: Write and validate SBOM
        id: validate
        run: |
          sbom="${RUNNER_TEMP}/tenkai.cdx.json"
          python3 scripts/release-metadata.py sbom "$sbom"
          echo "digest=$(sha256sum "$sbom" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --quiet --disable-pip-version-check \
            -r scripts/release-sbom-requirements.txt
          "${RUNNER_TEMP}/sbom-venv/bin/python" scripts/release-metadata.py check-sbom "$sbom"

  # Linux hosts build inside a glibc 2.28 image so they start on every
  # supported distribution (#904); the CI release dry run builds them the
  # same way.
  package-linux:
    name: Package linux-x86_64
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Build and package Linux hosts
        run: bash scripts/build-linux-release-hosts.sh --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-x86_64
          path: dist/*
          if-no-files-found: error

  package:
    name: Package ${{ matrix.platform }}
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Build community hosts
        run: |
          cargo build --release --locked --workspace --features tenkai-server/ui \
            --bin tenkaictl \
            --bin tenkai-server \
            --bin tenkai-executor-guard \
            --bin tenkai-runtime \
            --bin tenkai-runtime-guard
      - name: Package community hosts
        run: |
          mkdir -p dist
          bash scripts/package-release-binaries.sh package \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - name: Build hub tenkai-server
        run: cargo build --release --locked -p tenkai-server --features postgres,ui
      - name: Package hub tenkai-server
        run: |
          bash scripts/package-release-binaries.sh package-hub \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release assets
    if: needs.verify-tag.outputs.tag != ''
    needs: [package, package-linux, sbom, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "GitHub Release ${TAG} is already published; releases are immutable" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Add HTTP API contract
        run: cp api/tenkai-http-v1.schema.json dist/
      - name: Add install script for this version
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/package-release-binaries.sh install-script --out dist --version "${TAG#v}"
      - name: Refuse Linux hosts above the glibc floor
        run: bash scripts/package-release-binaries.sh check-glibc --out dist
      - name: Checksums
        run: bash scripts/package-release-binaries.sh checksums --out dist --require-complete
      - name: Add the validated SBOM
        env:
          VALIDATED: ${{ needs.sbom.outputs.digest }}
        run: |
          python3 scripts/release-metadata.py sbom dist/tenkai.cdx.json
          echo "${VALIDATED}  dist/tenkai.cdx.json" | sha256sum -c -
      - name: Attest provenance of binaries, API contract, checksums, and SBOM
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - name: Attest SBOM for checksummed assets
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/tenkai.cdx.json
      - name: Write family release manifest
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          python3 scripts/release-metadata.py manifest \
            --version "${TAG#v}" \
            --git-sha "${SHA}" \
            --tag "${TAG}" \
            --dist dist \
            --attestation "${PROVENANCE_URL}" \
            --attestation "${SBOM_URL}" \
            --out dist/tenkai-release.json
      - name: Attest family release manifest
        id: manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/tenkai-release.json
      - name: Release digests
        env:
          MANIFEST_URL: ${{ steps.manifest.outputs.attestation-url }}
        run: |
          {
            echo "### Release assets"
            echo
            echo "Manifest attestation: ${MANIFEST_URL}"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            sha256sum dist/tenkai.cdx.json dist/tenkai-release.json | sed 's| dist/| |'
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach GitHub Release assets
    if: needs.verify-tag.outputs.tag != ''
    needs: [attest, verify-tag]
    runs-on: ubuntu-latest
    # One publication at a time across tags, so the latest decision below
    # cannot be overtaken by another tag's publish. A third waiting publish
    # cancels the pending one; re-run it to resume its draft.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "GitHub Release ${TAG} is already published; releases are immutable" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # After the release-commit checkout, which would clean it away.
      - name: Check out main's release-tag verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/release-metadata.py notes "${TAG#v}" >"${RUNNER_TEMP}/notes.md"
      # Draft, attach, then publish. A rerun resumes a draft; a published
      # release is immutable and is never edited. A tag with - publishes a
      # pre-release that never becomes latest. A release below the highest
      # final tag on the remote (a previous maintenance line) is never latest
      # either. Main's verifier reads the tags right before the publishing
      # edit, inside the job-wide release-publish group.
      - name: Draft, attach assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          [[ "$PRERELEASE" == "$prerelease" ]] || { echo "prerelease output ${PRERELEASE} does not match tag ${TAG}" >&2; exit 1; }
          bash scripts/verify-release-tag.sh verify "$TAG" "$SHA"
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$draft" in
            false)
              echo "::error::GitHub Release ${TAG} is already published; releases are immutable"
              exit 1
              ;;
            missing)
              gh release create "$TAG" --draft --prerelease="$prerelease" --latest=false --verify-tag --title "$TAG" --notes-file "$notes"
              ;;
          esac
          bash scripts/verify-release-tag.sh verify "$TAG" "$SHA"
          gh release upload "$TAG" dist/* --clobber
          latest="$(bash "${MAIN_TREE}/scripts/verify-release-tag.sh" latest "$TAG")"
          gh release edit "$TAG" --notes-file "$notes" --draft=false --prerelease="$prerelease" --latest="$latest"
