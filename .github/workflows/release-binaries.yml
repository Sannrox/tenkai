name: Release binaries

# Signed v* tags only. Pull requests run scripts/release-dry-run.sh from CI,
# which never attests or publishes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Checkout may leave the tag pointing at the commit; fetch the tag object.
      - name: Fetch annotated tag
        run: git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Refuse lightweight, unsigned, or off-version tags
        run: bash scripts/verify-release-tag.sh verify-signed "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
      - name: Require the CHANGELOG section and its gate flags
        run: |
          python3 scripts/release-metadata.py notes "${GITHUB_REF_NAME#v}" >/dev/null
          python3 scripts/release-metadata.py gate-flags "${GITHUB_REF_NAME#v}"

  sbom:
    name: CycloneDX SBOM
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      # The validator is third-party Python, so it runs here, not in the job
      # that holds attestation permissions.
      - name: Write and validate SBOM
        run: |
          mkdir -p sbom
          python3 scripts/release-metadata.py sbom sbom/tenkai.cdx.json
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --quiet --disable-pip-version-check \
            -r scripts/release-sbom-requirements.txt
          "${RUNNER_TEMP}/sbom-venv/bin/python" scripts/release-metadata.py check-sbom sbom/tenkai.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/tenkai.cdx.json
          if-no-files-found: error

  package:
    name: Package ${{ matrix.platform }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: darwin-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Build community hosts
        run: |
          cargo build --release --locked --workspace --features tenkai-server/ui \
            --bin tenkaictl \
            --bin tenkai-server \
            --bin tenkai-executor-guard \
            --bin tenkai-runtime \
            --bin tenkai-runtime-guard
      - name: Package community hosts
        run: |
          mkdir -p dist
          bash scripts/package-release-binaries.sh package \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - name: Build hub tenkai-server
        run: cargo build --release --locked -p tenkai-server --features postgres,ui
      - name: Package hub tenkai-server
        run: |
          bash scripts/package-release-binaries.sh package-hub \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release assets
    needs: [package, sbom]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Add HTTP API contract
        run: cp api/tenkai-http-v1.schema.json dist/
      - name: Checksums
        run: bash scripts/package-release-binaries.sh checksums --out dist --require-complete
      - name: Add SBOM
        run: cp sbom/tenkai.cdx.json dist/
      - name: Attest provenance of binaries, API contract, checksums, and SBOM
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - name: Attest SBOM for checksummed assets
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/tenkai.cdx.json
      - name: Write family release manifest
        env:
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          python3 scripts/release-metadata.py manifest \
            --version "${GITHUB_REF_NAME#v}" \
            --git-sha "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --dist dist \
            --attestation "${PROVENANCE_URL}" \
            --attestation "${SBOM_URL}" \
            --out dist/tenkai-release.json
      - name: Attest family release manifest
        id: manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/tenkai-release.json
      - name: Release digests
        env:
          MANIFEST_URL: ${{ steps.manifest.outputs.attestation-url }}
        run: |
          {
            echo "### Release assets"
            echo
            echo "Manifest attestation: ${MANIFEST_URL}"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            sha256sum dist/tenkai.cdx.json dist/tenkai-release.json | sed 's| dist/| |'
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach GitHub Release assets
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Notes from CHANGELOG
        run: python3 scripts/release-metadata.py notes "${GITHUB_REF_NAME#v}" >"${RUNNER_TEMP}/notes.md"
      # Draft, attach, then publish. A rerun resumes a draft; a published
      # release is immutable and is never edited.
      - name: Draft, attach assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/notes.md"
          bash scripts/verify-release-tag.sh verify "$tag" "$GITHUB_SHA"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$draft" in
            false)
              echo "::error::GitHub Release ${tag} is already published; releases are immutable"
              exit 1
              ;;
            missing)
              gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file "$notes"
              ;;
          esac
          bash scripts/verify-release-tag.sh verify "$tag" "$GITHUB_SHA"
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --notes-file "$notes" --draft=false --latest
