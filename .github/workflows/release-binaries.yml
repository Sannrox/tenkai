name: Release binaries

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. CI runs
# scripts/release-dry-run.sh (see its Release dry run job). workflow_dispatch without a
# tag dry-runs the packaging path and never attests or publishes. Release
# logic lives in scripts/release/; scripts/tests/release/ tests it and this
# file's structure.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # start from main: main's scripts/release/verify-tag.sh and allowed keys
  # verify the signed tag against the tagged commit's Cargo.toml. That commit
  # must be on main or the matching release-* line. A dry run resolves the
  # checked-out commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      line: ${{ steps.verify.outputs.line }}
    steps:
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
          persist-credentials: false
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify the signed tag on main
        if: inputs.tag != ''
        id: verify
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
          RELEASE_ROOT: ${{ github.workspace }}/source
          RELEASE_TAG_KEY: ${{ github.workspace }}/main-tree/security/release-tag-key.asc
          RELEASE_TAG_FINGERPRINTS: ${{ github.workspace }}/main-tree/security/release-tag-fingerprints
        run: bash "${MAIN_TREE}/scripts/release/verify-tag.sh" release-commit "$TAG" "$WORKFLOW_REF" >>"$GITHUB_OUTPUT"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: bash main-tree/scripts/release/github-release.sh guard "$TAG"
      - name: Require the CHANGELOG section and its gate flags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release/metadata.py notes "${TAG#v}" >/dev/null
          python3 scripts/release/metadata.py gate-flags "${TAG#v}"
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  dry-run:
    name: Dry-run packaging
    if: needs.verify-tag.outputs.tag == ''
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r scripts/tests/requirements.txt
      - run: python -m unittest discover -s scripts/tests -t . -v
      - run: bash scripts/package-release-binaries.sh self-test
      - run: bash scripts/test-install-script.sh
      - run: bash scripts/release-dry-run.sh

  sbom:
    name: Validate CycloneDX SBOM
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.validate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      # The validator is third-party Python. It only reads the SBOM: the
      # digest is taken before it is installed, and the attest job
      # regenerates the SBOM and must match that digest.
      - name: Write and validate SBOM
        id: validate
        run: |
          sbom="${RUNNER_TEMP}/tenkai.cdx.json"
          python3 scripts/release/metadata.py sbom "$sbom"
          echo "digest=$(sha256sum "$sbom" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --quiet --disable-pip-version-check \
            -r scripts/release-sbom-requirements.txt
          "${RUNNER_TEMP}/sbom-venv/bin/python" scripts/release/metadata.py check-sbom "$sbom"

  # Linux hosts build inside a glibc 2.28 image so they start on every
  # supported distribution (#904); the CI release dry run builds the x86_64
  # hosts the same way. Each architecture builds natively on its own runner.
  package-linux:
    name: Package ${{ matrix.platform }}
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Build and package Linux hosts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/build-linux-release-hosts.sh --platform "$PLATFORM" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  package:
    name: Package ${{ matrix.platform }}
    if: needs.verify-tag.outputs.tag != ''
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Build community hosts
        run: |
          cargo build --release --locked --workspace --features tenkai-server/ui \
            --bin tenkaictl \
            --bin tenkai-server \
            --bin tenkai-executor-guard \
            --bin tenkai-runtime \
            --bin tenkai-runtime-guard
      - name: Package community hosts
        run: |
          mkdir -p dist
          bash scripts/package-release-binaries.sh package \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - name: Build hub tenkai-server
        run: cargo build --release --locked -p tenkai-server --features postgres,ui
      - name: Package hub tenkai-server
        run: |
          bash scripts/package-release-binaries.sh package-hub \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release assets
    if: needs.verify-tag.outputs.tag != ''
    needs: [package, package-linux, sbom, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so check again here.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh guard "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Add HTTP API contract
        run: cp api/tenkai-http-v1.schema.json dist/
      - name: Add install script for this version
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/package-release-binaries.sh install-script --out dist --version "${TAG#v}"
      - name: Add .deb and .rpm packages
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          for platform in linux-x86_64 linux-aarch64; do
            bash scripts/package-release-binaries.sh system-packages \
              --out dist --platform "$platform" --version "${TAG#v}"
          done
      - name: Refuse Linux hosts above the glibc floor
        run: bash scripts/package-release-binaries.sh check-glibc --out dist
      - name: Checksums
        run: bash scripts/package-release-binaries.sh checksums --out dist --require-complete
      # Pinned by SHA256SUMS; attached to the Release and pushed to the tap
      # by the tap job once the Release is public.
      - name: Write the Homebrew formula
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/release/metadata.py formula --version "${TAG#v}" --dist dist --out dist/tenkai.rb
      - name: Add the validated SBOM
        env:
          VALIDATED: ${{ needs.sbom.outputs.digest }}
        run: |
          python3 scripts/release/metadata.py sbom dist/tenkai.cdx.json
          echo "${VALIDATED}  dist/tenkai.cdx.json" | sha256sum -c -
      - name: Attest provenance of binaries, API contract, checksums, and SBOM
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - name: Attest SBOM for checksummed assets
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/tenkai.cdx.json
      - name: Write family release manifest
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          python3 scripts/release/metadata.py manifest \
            --version "${TAG#v}" \
            --git-sha "${SHA}" \
            --tag "${TAG}" \
            --dist dist \
            --attestation "${PROVENANCE_URL}" \
            --attestation "${SBOM_URL}" \
            --out dist/tenkai-release.json
      - name: Attest family release manifest
        id: manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/tenkai-release.json
      - name: Release digests
        env:
          MANIFEST_URL: ${{ steps.manifest.outputs.attestation-url }}
        run: |
          {
            echo "### Release assets"
            echo
            echo "Manifest attestation: ${MANIFEST_URL}"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            sha256sum dist/tenkai.cdx.json dist/tenkai-release.json | sed 's| dist/| |'
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach GitHub Release assets
    if: needs.verify-tag.outputs.tag != ''
    needs: [attest, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs, so check again here.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh guard "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/release/metadata.py notes "${TAG#v}" >"${RUNNER_TEMP}/notes.md"
      # Draft (or resume the draft) with every asset, then publish. The live
      # tag must still resolve to the release commit before each change.
      - name: Require the live tag at the release commit
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: bash scripts/release/verify-tag.sh verify "$TAG" "$SHA"
      - name: Draft GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/release/github-release.sh draft "$TAG" "${RUNNER_TEMP}/notes.md" dist/*
      - name: Require the live tag at the release commit
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: bash scripts/release/verify-tag.sh verify "$TAG" "$SHA"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          LINE: ${{ needs.verify-tag.outputs.line }}
        run: bash scripts/release/github-release.sh publish "$TAG" "$LINE"

  # Installs the published formula and the runtime LaunchDaemon on a clean
  # macOS host, then points the tap at the formula. It runs after publish, so
  # a failure here never holds back or changes the Release; the formula stays
  # attached to the Release as tenkai.rb either way.
  tap:
    name: Verify macOS install and update the tap
    if: needs.verify-tag.outputs.tag != ''
    needs: [publish, verify-tag]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Install from the published Release
        run: bash scripts/test-macos-install.sh --dist dist
      # Only final releases move the tap; a release candidate stays on its
      # GitHub Release. The token goes to git through its environment, never
      # its command line.
      - name: Push the formula to the tap
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "release candidate ${TAG}: tap unchanged"
            exit 0
          fi
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN unset: tap unchanged, formula attached to the Release as tenkai.rb"
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64)"
          export GIT_CONFIG_VALUE_0
          tap="${RUNNER_TEMP}/tap"
          git clone --depth 1 https://github.com/Sannrox/homebrew-tap.git "$tap"
          mkdir -p "${tap}/Formula"
          cp dist/tenkai.rb "${tap}/Formula/tenkai.rb"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Formula/tenkai.rb
          if git -C "$tap" diff --cached --quiet; then
            echo "tap formula already at ${TAG}"
            exit 0
          fi
          git -C "$tap" commit -m "tenkai ${TAG#v}"
          git -C "$tap" push origin HEAD:main

  # A dispatch without a tag also proves the formula and the LaunchDaemon on
  # macOS, from hosts built at this commit. Linux downloads in the formula are
  # stand-ins this job never fetches.
  dry-run-macos:
    name: Dry-run macOS install
    if: needs.verify-tag.outputs.tag == ''
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          persist-credentials: false
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Build community hosts
        run: |
          cargo build --release --locked --workspace --features tenkai-server/ui \
            --bin tenkaictl \
            --bin tenkai-server \
            --bin tenkai-executor-guard \
            --bin tenkai-runtime \
            --bin tenkai-runtime-guard
      - name: Package hosts and write a formula that downloads them locally
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/package-release-binaries.sh package --out dist --platform darwin-aarch64 --strip
          for host in tenkaictl tenkai-server tenkai-executor-guard; do
            for platform in linux-x86_64 linux-aarch64; do
              echo stand-in >"dist/${host}-${platform}"
            done
          done
          bash scripts/package-release-binaries.sh checksums --out dist
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          python3 scripts/release/metadata.py formula --version "$version" --dist dist \
            --out dist/tenkai.rb --base-url "file://${PWD}/dist"
      - name: Install with the formula and the LaunchDaemon
        run: bash scripts/test-macos-install.sh --dist dist
