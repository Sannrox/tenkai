name: Release binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: darwin-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Build community hosts
        run: |
          cargo build --release --locked \
            --bin tenkaictl \
            --bin tenkai-server \
            --bin tenkai-executor-guard \
            --bin tenkai-runtime \
            --bin tenkai-runtime-guard
      - name: Package
        run: |
          mkdir -p dist
          bash scripts/package-release-binaries.sh package \
            --out dist \
            --platform ${{ matrix.platform }} \
            --strip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach GitHub Release assets
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: bash scripts/package-release-binaries.sh checksums --out dist --require-complete
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif ! gh release create "$tag" dist/* --verify-tag --generate-notes --title "$tag" --latest; then
            gh release view "$tag" >/dev/null 2>&1
            gh release upload "$tag" dist/* --clobber
          fi
