[package]
name = "tenkai-executor"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Kubernetes software-executor adapters for Tenkai apply."

[dependencies]
tenkai = { path = "../..", version = "0.5.0" }
anyhow = "1"
k8s-openapi = { version = "0.26.1", default-features = false, features = ["latest"] }
kube = { version = "2.0.1", default-features = false, features = ["client", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
