[package]
name = "tenkai-host-applier"
version = "0.6.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Root-side applier for Tenkai's privileged host releases (ADR 0041)."

[dependencies]
tenkai = { path = "../..", version = "0.6.0" }
anyhow = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tenkai = { path = "../..", version = "0.6.0", features = ["test-support"] }
uuid = { version = "1", features = ["v4"] }
