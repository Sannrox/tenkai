[package]
name = "tenkai-host-applier"
version = "0.8.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Root-side applier for Tenkai's privileged host releases (ADR 0041)."

[[bin]]
name = "tenkai-host-applier"
path = "src/bin/tenkai-host-applier.rs"

[dependencies]
tenkai = { path = "../..", version = "0.8.0" }
anyhow = "1"
zeroize = "1"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", default-features = false, features = ["macros", "process", "rt", "signal", "time"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
tenkai = { path = "../..", version = "0.8.0", features = ["test-support"] }
