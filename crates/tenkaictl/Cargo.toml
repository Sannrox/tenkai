[package]
name = "tenkaictl"
version = "0.4.1"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Embedded and remote CLI for the Tenkai delivery control plane."

[[bin]]
name = "tenkaictl"
path = "src/main.rs"

[dependencies]
tenkai = { path = "../..", version = "0.4.1" }
tenkai-executor = { path = "../tenkai-executor", version = "0.4.1" }
tenkai-http = { path = "../tenkai-http", version = "0.4.1" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
