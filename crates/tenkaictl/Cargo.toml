[package]
name = "tenkaictl"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Embedded and remote CLI for the Tenkai delivery control plane."

[[bin]]
name = "tenkaictl"
path = "src/main.rs"

[dependencies]
tenkai = { path = "../..", version = "0.5.0" }
tenkai-executor = { path = "../tenkai-executor", version = "0.5.0" }
tenkai-http = { path = "../tenkai-http", version = "0.5.0" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
