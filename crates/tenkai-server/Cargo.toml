[package]
name = "tenkai-server"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Networked Tenkai control-plane host."

[[bin]]
name = "tenkai-server"
path = "src/main.rs"

[features]
default = []
ui = ["tenkai-http/ui"]
postgres = ["tenkai-postgres/postgres"]

[dependencies]
tenkai = { path = "../..", version = "0.5.0" }
tenkai-executor = { path = "../tenkai-executor", version = "0.5.0" }
tenkai-postgres = { path = "../tenkai-postgres", version = "0.5.0" }
tenkai-http = { path = "../tenkai-http", version = "0.5.0" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["derive", "env", "error-context", "help", "std", "usage"] }
ed25519-dalek = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# Certificates close to expiry for the trust change-event test (#784).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
time = { version = "0.3", default-features = false }
