[package]
name = "tenkai-server"
version = "0.4.2"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Networked Tenkai control-plane host."

[[bin]]
name = "tenkai-server"
path = "src/main.rs"

[features]
default = []
ui = ["tenkai-http/ui"]
postgres = ["tenkai-postgres/postgres"]

[dependencies]
tenkai = { path = "../..", version = "0.4.2" }
tenkai-executor = { path = "../tenkai-executor", version = "0.4.2" }
tenkai-postgres = { path = "../tenkai-postgres", version = "0.4.2" }
tenkai-http = { path = "../tenkai-http", version = "0.4.2" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
