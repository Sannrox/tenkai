[package]
name = "tenkai-wire"
version = "0.9.1"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Generated gRPC contracts for Tenkai records, runtime, and graph actions."

[dependencies]
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
