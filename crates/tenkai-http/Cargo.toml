[package]
name = "tenkai-http"
version = "0.4.1"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Authenticated HTTP host and remote client for the Tenkai application core."

[features]
default = []
ui = ["dep:reqwest", "dep:zip"]

[dependencies]
tenkai = { path = "../..", version = "0.4.1" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tenkai = { path = "../..", version = "0.4.1", features = ["test-support"] }
toml = "0.8"

[build-dependencies]
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
