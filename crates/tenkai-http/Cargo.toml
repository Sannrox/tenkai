[package]
name = "tenkai-http"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Authenticated HTTP host and remote client for the Tenkai application core."

[features]
default = []
ui = ["dep:reqwest", "dep:zip"]

[dependencies]
tenkai = { path = "../..", version = "0.5.0" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", features = ["raw_value"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tenkai = { path = "../..", version = "0.5.0", features = ["test-support"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
toml = "0.8"

[build-dependencies]
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
