[package]
name = "tenkai-postgres"
version = "0.4.2"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Optional PostgreSQL hub tenant store and delivery-effect conformance harness."

[[bin]]
name = "tenkai-delivery-conformance"
path = "src/bin/tenkai-delivery-conformance.rs"
required-features = ["postgres"]

[features]
default = []
postgres = [
    "dep:postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]

[dependencies]
tenkai = { path = "../..", version = "0.4.2" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
