[package]
name = "tenkai-keys"
version = "0.8.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Customer-key release document and PKCS#11/KMIP key-provider adapters shared by Tenkai and the products it delivers."

[dependencies]
sekai-keys = { git = "https://github.com/Sannrox/sekai-chisei", rev = "40ab00a4954d435c67c6c12b560522ba5eaebb53", version = "1.0.0" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
cryptoki = { version = "0.10", optional = true }
ring = { version = "0.17", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
# PKCS#11 HSM adapter (a software token stands in for the HSM in tests).
pkcs11 = ["dep:cryptoki", "dep:ring"]
# KMIP 1.4 adapter plus the loopback lab endpoint.
kmip = ["dep:ring"]
# Software-token pool for tests in this crate and its consumers.
test-support = ["pkcs11", "dep:uuid"]

[dev-dependencies]
# Run this crate's own tests with every adapter, also under `-p tenkai-keys`.
tenkai-keys = { path = ".", features = ["kmip", "pkcs11", "test-support"] }
