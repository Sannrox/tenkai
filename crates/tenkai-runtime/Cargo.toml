[package]
name = "tenkai-runtime"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Pull-only environment runtime and process-fence hosts for Tenkai."

[[bin]]
name = "tenkai-runtime"
path = "src/bin/tenkai-runtime.rs"

[[bin]]
name = "tenkai-runtime-guard"
path = "src/bin/tenkai-runtime-guard.rs"

[[bin]]
name = "tenkai-executor-guard"
path = "src/bin/tenkai-executor-guard.rs"

[[bin]]
name = "tenkai-worker-lifecycle-fixture"
path = "src/bin/tenkai-worker-lifecycle-fixture.rs"

[dependencies]
tenkai = { path = "../..", version = "0.5.0" }
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "env", "error-context", "help", "std", "usage"] }
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
