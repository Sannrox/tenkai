[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[package]
name = "tenkai"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
readme = "README.md"
description = "Local-first, constraint-based delivery control plane backed by sekai-chisei."

[dependencies]
tenkai-wire = { path = "crates/tenkai-wire", version = "0.5.0" }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
# RS256/ES256 verification for OIDC access tokens (#468); already in the tree via rustls.
ring = "0.17"
# JSON Schema for the published HTTP API contract (#471).
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
semver = "1"
anyhow = "1"
libc = "0.2"
url = "2"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", default-features = false, features = ["backup", "bundled"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Validates TENKAI_CA_BUNDLE certificates as trust anchors (#633); already in the tree via reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# SMTP STARTTLS for the operational digest sink (#725), with the shared trust.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei", rev = "67157d1fa242ac2f133c88243ef23b56f88042e6", version = "0.1.2" }
tar = { version = "0.4", default-features = false }
cryptoki = "0.10"
sekai-keys = { git = "https://github.com/Sannrox/sekai-chisei", rev = "40ab00a4954d435c67c6c12b560522ba5eaebb53", version = "1.0.0" }

[features]
default = []
# Test helpers consumed by tenkai-http (OIDC signer, in-memory store outage).
test-support = []

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring", "tls-webpki-roots", "transport"] }
# Throwaway CA and HTTPS server for the outbound TLS tests (#633).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-stream = "0.1"
ed25519-dalek = "2"
base64 = "0.22"

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
