[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[package]
name = "tenkai"
version = "0.4.1"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
readme = "README.md"
description = "Local-first, constraint-based delivery control plane backed by sekai-chisei."

[[bin]]
name = "tenkai-executor-guard"
path = "src/bin/tenkai-executor-guard.rs"

[[bin]]
name = "tenkai-runtime"
path = "src/bin/tenkai-runtime.rs"

[[bin]]
name = "tenkai-runtime-guard"
path = "src/bin/tenkai-runtime-guard.rs"

[[bin]]
name = "tenkai-worker-lifecycle-fixture"
path = "src/bin/tenkai-worker-lifecycle-fixture.rs"

[dependencies]
tenkai-wire = { path = "crates/tenkai-wire", version = "0.4.1" }
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "io-util", "io-std", "net"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
# RS256/ES256 verification for OIDC access tokens (#468); already in the tree via rustls.
ring = "0.17"
# JSON Schema for the published HTTP API contract (#471).
schemars = "1"
semver = "1"
anyhow = "1"
libc = "0.2"
url = "2"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sekai-client = { git = "https://github.com/Sannrox/sekai-chisei", rev = "67157d1fa242ac2f133c88243ef23b56f88042e6", version = "0.1.2" }

[features]
default = []
# Test helpers consumed by tenkai-http (OIDC signer, in-memory store outage).
test-support = []

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-stream = "0.1"
ed25519-dalek = "2"
base64 = "0.22"
