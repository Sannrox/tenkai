# Sample product-repo workflow. Copy into the product repository; do not enable
# it as a live workflow in the Tenkai control-plane checkout.
name: Publish to Tenkai

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tenkaictl
        run: |
          set -euo pipefail
          # Install a pinned tenkaictl from your artifact store.
          install -m 0755 ./tenkaictl /usr/local/bin/tenkaictl
      - name: Render and sign
        env:
          TENKAI_TRUST_ROOTS: ${{ secrets.TENKAI_TRUST_ROOTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$TENKAI_TRUST_ROOTS" > "$RUNNER_TEMP/release-trust.toml"
          tenkaictl release render deploy/tenkai.toml \
            --version "${GITHUB_REF_NAME#v}" \
            --out deploy/tenkai.rendered.toml
          # Sign deploy/tenkai.rendered.toml with the product's release key.
          # Write the envelope to $RUNNER_TEMP/tenkai.sig.json. Keep the
          # rendered file next to the source so deploy.workdir still resolves.
      - name: Publish and promote
        # Pin to a Tenkai release tag or full commit SHA.
        uses: Sannrox/tenkai/.github/actions/publish-release@<tag or commit SHA>
        with:
          manifest: deploy/tenkai.rendered.toml
          signature: ${{ runner.temp }}/tenkai.sig.json
          trust-roots: ${{ runner.temp }}/release-trust.toml
          server-url: ${{ vars.TENKAI_SERVER_URL }}
          client-id: ${{ vars.TENKAI_OIDC_CLIENT_ID }}
          client-secret: ${{ secrets.TENKAI_OIDC_CLIENT_SECRET }}
          channel: stable
